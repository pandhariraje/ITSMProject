<template>
    <lightning-card title="Upload Attachment" icon-name="utility:attach">
        <div class="slds-p-around_medium">
            <lightning-file-upload
                label="Attach screenshot or logs"
                name="fileUploader"
                accept={acceptedFormats}
                record-id={recordId}
                onuploadfinished={handleUploadFinished}
                multiple>
            </lightning-file-upload>
        </div>
    </lightning-card>
</template>
