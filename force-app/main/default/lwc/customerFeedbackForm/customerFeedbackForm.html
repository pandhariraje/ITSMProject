<template>
    <lightning-card title="Submit Feedback" icon-name="utility:like">
        <div class="slds-var-p-around_medium">
            <template if:true={submitted}>
                <div class="slds-text-align_center slds-text-color_success">
                    <p class="slds-text-heading_medium">Thank you for your feedback!</p>
                </div>
            </template>
            <template if:false={submitted}>
                <lightning-combobox
                    name="rating"
                    label="Rate your support experience"
                    value={rating}
                    placeholder="Select a rating..."
                    options={ratingOptions}
                    onchange={handleRatingChange}
                    required>
                </lightning-combobox>
                <lightning-textarea
                    name="comments"
                    label="Comments"
                    placeholder="Share your thoughts about IT Support Copilot..."
                    value={comments}
                    onchange={handleCommentsChange}>
                </lightning-textarea>
                <div class="slds-var-m-top_medium slds-text-align_right">
                    <lightning-button
                        label="Submit"
                        variant="brand"
                        onclick={handleSubmit}
                        disabled={isSubmitDisabled}>
                    </lightning-button>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
